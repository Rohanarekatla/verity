<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contrast pixel-sampling fixture</title>
  <style>
    body { margin: 0; padding: 24px; background: #fff; font-family: sans-serif; }
    .cell { display: block; margin-bottom: 20px; }

    /* A3.2 acceptance: on a SOLID background the estimated background must
       match the CSS background exactly. White text on solid #808080. */
    #solid-grey {
      color: #ffffff;
      background: #808080;
      padding: 16px;
      width: 320px;
      font-size: 20px;
      font-weight: bold;
    }

    /* Solid, high-contrast control: black text on white. */
    #solid-white {
      color: #000000;
      background: #ffffff;
      padding: 16px;
      width: 320px;
      font-size: 20px;
    }

    /* The real case: white text over a busy embedded image. axe marks this
       `incomplete` because static analysis can't know the pixels behind the
       glyphs. Embedded as a data URI so the fixture is hermetic — no network,
       no cross-origin taint. The checkerboard has a light square, so
       worst-case contrast (white text over the light square) is poor. */
    #over-image {
      color: #ffffff;
      padding: 16px;
      width: 320px;
      font-size: 20px;
      font-weight: bold;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="%23202020"/><rect width="10" height="10" fill="%23e8e8e8"/><rect x="10" y="10" width="10" height="10" fill="%23e8e8e8"/></svg>');
    }
  </style>
</head>
<body>
  <div class="cell"><span id="solid-grey">White text on solid grey background</span></div>
  <div class="cell"><span id="solid-white">Black text on solid white background</span></div>
  <div class="cell"><span id="over-image">White text over a busy checkerboard image</span></div>
  <!-- BC-A2: one region, two fonts. Large heading text with a small inline
       note — no single SC 1.4.3 threshold applies, so font_uniform is false. -->
  <div class="cell"><span id="mixed-font" style="color:#000;background:#fff;font-size:24px">Large heading <small style="font-size:12px">with small print</small></span></div>
  <!-- apple.com regressions. #clip-text paints its glyphs with the
       background (background-clip:text), so CSS color is not the on-screen
       colour. #fade-a / #fade-b carry transition:all — sampling one used to
       leave the other mid-fade from transparent when sampled next. -->
  <div class="cell"><span id="clip-text" style="font-size:24px;color:#fff;background:linear-gradient(#fff,#ddd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Gradient text</span></div>
  <div class="cell" style="background:#000;padding:8px"><a id="fade-a" href="#" style="color:#2997ff;transition:all .4s;font-size:17px">Buy</a> <a id="fade-b" href="#" style="color:#2997ff;transition:all .4s;font-size:17px">Learn more</a></div>
  <div class="cell" aria-hidden="true"><span id="decor" style="color:#555;background:#333;font-size:16px">/ / / / / decorative</span></div>
</body>
</html>
