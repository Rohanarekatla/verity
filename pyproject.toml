[project]
name = "verity"
version = "0.1.0"
description = "Polyglot WCAG accessibility conformance engine: Python orchestrator + Node/Playwright/axe-core worker"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"