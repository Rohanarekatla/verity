[project]
name = "verity"
version = "0.1.0"
description = "Polyglot WCAG accessibility conformance engine: Python orchestrator + Node/Playwright/axe-core worker"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.8.0",
    "beautifulsoup4>=4.15.0",
    "colorama==0.4.6",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
]
# No console-script entry point, deliberately.
#
# It needs an editable install, and on this setup both hatchling and
# setuptools write a .pth file with no trailing newline. CPython's site.py
# skips that final line, the path (or import hook) is never installed, and
# `verity` dies with ModuleNotFoundError. Verified by hand: the identical
# path in a .pth *with* a trailing newline resolves fine. It also failed
# non-deterministically -- 4 of 8 consecutive runs -- which is worse than
# failing outright, because it looks like a broken machine rather than a
# broken package.
#
# Run the CLI as a module from the repo root instead:
#     cd <repo root> && uv run python -m verity.cli scan <url>
#
# Revisit at Week 19/20, where packaging for distribution builds a real
# wheel rather than an editable install and this does not apply.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
