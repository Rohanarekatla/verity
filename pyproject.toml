[project]
name = "verity"
version = "0.1.0"
description = "Polyglot WCAG accessibility conformance engine: Python orchestrator + Node/Playwright/axe-core worker"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.8.0",
    "colorama==0.4.6",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
