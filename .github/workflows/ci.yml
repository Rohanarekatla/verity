name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-worker:
    name: node-worker (build + test)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: node-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-worker/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  python-orchestrator:
    name: verity (pytest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest verity/tests/ -v

  docker-image:
    name: readiness image (build + smoke)
    runs-on: ubuntu-latest   # macOS runners have no Docker daemon
    steps:
      - uses: actions/checkout@v4
      - name: Build the readiness-scan image
        run: docker build -f deploy/Dockerfile -t verity:ci .
      # Smoke tests that need no browser: the entrypoint runs and imports load,
      # and a real subcommand (webmcp, static HTML) works end to end in-image.
      - name: Smoke — CLI entrypoint
        run: docker run --rm verity:ci --help
      - name: Smoke — webmcp on a bundled fixture
        run: docker run --rm verity:ci webmcp /app/data/fixtures/contrast-fail.html

  contract:
    name: cross-language contract check
    runs-on: macos-latest
    needs: [node-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-worker/package-lock.json
      - uses: astral-sh/setup-uv@v3
      - working-directory: node-worker
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - run: python3 node-worker/contract/reference_client.py
      # With the worker built, the browser integration tests that the
      # Python-only job skips (the Week 1 gate guard, the sampleRegion
      # round-trip) actually run here.
      - run: uv run pytest verity/tests/ -v
