# Spike A corpus — source pages (A2.3)
#
# The corpus is version-controlled by THIS manifest, not by committing the
# generated HTML. Pages are fetched once and cached; the generator then
# applies the Week 1 injectors to produce labelled good/bad pairs.
#
# Sources are chosen to be clean starting points — pages that should not
# already contain the defect being injected — so that a finding on the
# injected copy is attributable to the injection and nothing else.
#
# `id` must be stable: it names the output directory and appears in every
# label, so changing one invalidates comparisons across runs.

sources:
