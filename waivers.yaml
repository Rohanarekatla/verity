# Waivers — accepted, justified conformance failures.
#
# Keyed by finding signature: sha256("<sc_id>|<normalised selector>|<rule_id>"),
# as produced by verity.agents.validator.generate_finding_signature.
#
# To obtain the signature for a finding, run a scan with -o report.json and
# read `evidence.computed_values.waiver.signature` once waived, or compute it:
#
#   python -c "from verity.agents.validator import generate_finding_signature as s; \
#              print(s('1.4.3', '#btn', 'color-contrast'))"
#
# The shipped default waives NOTHING. A waiver is a per-project decision a team
# makes about its own site; it must never ship suppressing a finding out of the
# box, and never target a test fixture — that hides exactly the regressions the
# fixtures exist to catch.
#
# Expiry is recorded but NOT yet enforced — that is B7.3 (Week 7).
#
# Example (commented out — replace the signature with a real one):
#
# partialFingerprints:
#   "<64-hex-char signature>":
#     justification: "Brand colors explicitly approved by the design team."
#     approved_by: "Design Lead"
#     created: "2026-08-17"
#     expires: "2027-08-17"

partialFingerprints: {}
